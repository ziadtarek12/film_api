services:
  neo4j:
    image: neo4j:5
    restart: unless-stopped
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt protocol
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-changeme-strong-password}
      NEO4J_PLUGINS: '[]'
      NEO4J_server_memory_heap_initial__size: "256m"
      NEO4J_server_memory_heap_max__size: "512m"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4000}:4000"
    command:
      - "-port=4000"
      - "-limiter-rps=${LIMITER_RPS:-100}"
      - "-limiter-burst=${LIMITER_BURST:-200}"
      - "-limiter-enabled=${LIMITER_ENABLED:-true}"
      - "-cors-trusted-origin=*"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme-strong-password}
      JWT_SECRET: ${JWT_SECRET:-replace-me-with-a-32-char-secret}
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
